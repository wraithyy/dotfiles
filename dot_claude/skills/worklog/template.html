<title>__TITLE__ — vykazování</title>
<style>

:root {
  color-scheme: light dark;

  --bg: #f5f6f4;
  --surface: #ffffff;
  --surface-2: #edf0eb;
  --ink: #1e2422;
  --ink-muted: #5b655f;
  --ink-faint: #8a938c;
  --rule: #dbdfd8;
  --rule-strong: #c2c7bd;
  --accent: #2f6f6b;
  --accent-ink: #1b4643;
  --accent-soft: #e3ede9;
  --ok-fg: #2e7d46;
  --ok-bg: #e2f0e4;

  --catA-fg: #1b4643; --catA-bg: #e3ede9;
  --catB-fg: #7a3f18; --catB-bg: #f2e4d5;
  --catC-fg: #7a2c1a; --catC-bg: #f3e0d9;
  --catD-fg: #333c44; --catD-bg: #e7eaee;
  --catE-fg: #5c3452; --catE-bg: #ecdfe8;
  --catF-fg: #37356e; --catF-bg: #e2e1f2;

  --shadow: 0 1px 2px rgba(30,36,34,.05), 0 6px 18px -10px rgba(30,36,34,.10);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121620;
    --surface: #181d29;
    --surface-2: #1f2531;
    --ink: #e7e9e4;
    --ink-muted: #9aa3ac;
    --ink-faint: #6d7681;
    --rule: #2a3140;
    --rule-strong: #384056;
    --accent: #6fbdb4;
    --accent-ink: #9adbd2;
    --accent-soft: #1c3733;
    --ok-fg: #6fcb86;
    --ok-bg: #1e3324;

    --catA-fg: #9adbd2; --catA-bg: #1c3733;
    --catB-fg: #e6b17f; --catB-bg: #3a2c1c;
    --catC-fg: #e79484; --catC-bg: #3a251f;
    --catD-fg: #c3ccd6; --catD-bg: #262c38;
    --catE-fg: #d8aecb; --catE-bg: #362b40;
    --catF-fg: #b3b2e6; --catF-bg: #292850;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.5);
  }
}

:root[data-theme="dark"] {
  --bg: #121620;
  --surface: #181d29;
  --surface-2: #1f2531;
  --ink: #e7e9e4;
  --ink-muted: #9aa3ac;
  --ink-faint: #6d7681;
  --rule: #2a3140;
  --rule-strong: #384056;
  --accent: #6fbdb4;
  --accent-ink: #9adbd2;
  --accent-soft: #1c3733;
  --ok-fg: #6fcb86;
  --ok-bg: #1e3324;

  --catA-fg: #9adbd2; --catA-bg: #1c3733;
  --catB-fg: #e6b17f; --catB-bg: #3a2c1c;
  --catC-fg: #e79484; --catC-bg: #3a251f;
  --catD-fg: #c3ccd6; --catD-bg: #262c38;
  --catE-fg: #d8aecb; --catE-bg: #362b40;
  --catF-fg: #b3b2e6; --catF-bg: #292850;

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }

body {
  font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 14.5px;
  line-height: 1.5;
}

.mono {
  font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

.page {
  max-width: 980px;
  margin: 0 auto;
  padding: clamp(20px, 4vw, 52px) clamp(16px, 4vw, 24px) 80px;
}

/* ---------- header ---------- */

header.masthead {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.eyebrow {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11.5px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin: 0 0 8px;
}

h1 {
  font-size: clamp(24px, 3.6vw, 30px);
  font-weight: 800;
  letter-spacing: -.01em;
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}

.progress-card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 12px 18px;
  box-shadow: var(--shadow);
  min-width: 220px;
}

.progress-card .num {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 22px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.progress-card .num .of { color: var(--ink-faint); font-weight: 400; }

.progress-card .label {
  font-size: 11.5px;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 6px;
}

.bar-track {
  height: 6px;
  border-radius: 4px;
  background: var(--surface-2);
  overflow: hidden;
  margin-top: 8px;
}

.bar-fill {
  height: 100%;
  background: var(--ok-fg);
  border-radius: 4px;
  width: 0%;
  transition: width .25s ease;
}

/* ---------- filters ---------- */

.filterbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.filter-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-row .fl-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--ink-faint);
  width: 70px;
  flex-shrink: 0;
}

.chip {
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 5px 11px;
  border-radius: 100px;
  border: 1px solid var(--rule-strong);
  background: transparent;
  color: var(--ink-muted);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
  line-height: 1.3;
}

.chip:hover { border-color: var(--accent); }

.chip.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.filter-tools {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-top: 8px;
  border-top: 1px solid var(--rule);
  flex-wrap: wrap;
}

.search-input {
  flex: 1;
  min-width: 160px;
  font-family: inherit;
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--rule-strong);
  background: var(--surface-2);
  color: var(--ink);
}

.search-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.toggle-unlogged {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--ink-muted);
  cursor: pointer;
  user-select: none;
}

.reset-btn {
  font-family: inherit;
  font-size: 12.5px;
  color: var(--ink-faint);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
  margin-left: auto;
}
.reset-btn:hover { color: var(--ink); }

/* ---------- table ---------- */

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 640px;
}

thead th {
  position: sticky;
  top: 0;
  background: var(--surface-2);
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--ink-muted);
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule-strong);
  white-space: nowrap;
}

th.col-check, td.col-check { width: 40px; text-align: center; }

tbody tr.entry-row {
  border-bottom: 1px solid var(--rule);
  transition: background .12s;
}
tbody tr.entry-row:hover { background: var(--surface-2); }
tbody tr.entry-row.hidden-row { display: none; }

tbody tr.entry-row.checked { background: var(--ok-bg); }
tbody tr.entry-row.checked:hover { background: var(--ok-bg); }

tr.day-header th {
  position: sticky;
  top: 33px;
  z-index: 1;
  background: var(--surface-2);
  border-top: 1px solid var(--rule-strong);
  border-bottom: 1px solid var(--rule-strong);
  padding: 7px 12px;
  text-align: left;
}
tr.day-header:first-child th { border-top: none; }
tr.day-header.hidden-row { display: none; }

.day-header-inner {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.day-header-inner .dow {
  font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  font-weight: 800;
  font-size: 13px;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: .03em;
}
.day-header-inner .date {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
  color: var(--ink-faint);
}
.day-header-inner .count {
  margin-left: auto;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11.5px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .01em;
  padding: 2px 8px;
  border-radius: 10px;
  white-space: nowrap;
  display: inline-block;
}
.tag.catA { color: var(--catA-fg); background: var(--catA-bg); }
.tag.catB { color: var(--catB-fg); background: var(--catB-bg); }
.tag.catC { color: var(--catC-fg); background: var(--catC-bg); }
.tag.catD { color: var(--catD-fg); background: var(--catD-bg); }
.tag.catE { color: var(--catE-fg); background: var(--catE-bg); }
.tag.catF { color: var(--catF-fg); background: var(--catF-bg); }

.type-pill {
  font-size: 11px;
  color: var(--ink-muted);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  white-space: nowrap;
}

.desc-cell { min-width: 280px; max-width: 460px; }
.desc-cell .title { font-weight: 700; margin-bottom: 2px; }
.desc-cell .body { color: var(--ink-muted); font-size: 13px; line-height: 1.45; }

code, .file {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: .92em;
  background: var(--surface-2);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent-ink);
  white-space: nowrap;
}

.checkbox {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1.5px solid var(--rule-strong);
  background: var(--surface);
  cursor: pointer;
  appearance: none;
  display: inline-grid;
  place-content: center;
  vertical-align: middle;
}
.checkbox:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.checkbox::before {
  content: "";
  width: 10px;
  height: 10px;
  clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 45% 63%);
  transform: scale(0);
  background: var(--ok-fg);
  transition: transform .1s ease-in-out;
}
.checkbox:checked {
  border-color: var(--ok-fg);
}
.checkbox:checked::before { transform: scale(1); }

.no-results {
  padding: 32px 16px;
  text-align: center;
  color: var(--ink-faint);
  font-size: 13.5px;
}

/* ---------- open tasks ---------- */

.tasks {
  margin-top: 32px;
  padding-top: 22px;
  border-top: 1px solid var(--rule-strong);
}
.tasks h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--ink-muted);
  margin: 0 0 12px;
}
.tasks ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tasks li { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; color: var(--ink-muted); }
.tasks li::before {
  content: ""; flex: 0 0 12px; width: 12px; height: 12px; margin-top: 3px;
  border: 1.5px solid var(--rule-strong); border-radius: 3px;
}

.source-note {
  margin-top: 28px;
  font-size: 12px;
  color: var(--ink-faint);
  border-top: 1px solid var(--rule);
  padding-top: 14px;
}

@media (max-width: 560px) {
  header.masthead { flex-direction: column; }
  .progress-card { width: 100%; min-width: 0; }
}
</style>

<div class="page">

  <header class="masthead">
    <div>
      <p class="eyebrow">Vykazování · __PERSON__</p>
      <h1>__TITLE__</h1>
    </div>
    <div class="progress-card">
      <div class="label">Vykázáno</div>
      <div class="num"><span id="doneCount">0</span><span class="of" id="totalCount"></span></div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </header>

  <div class="filterbar">
    <div class="filter-row" id="dayFilters" data-filter="day">
      <span class="fl-label">Den</span>
    </div>
    <div class="filter-row" id="catFilters" data-filter="cat">
      <span class="fl-label">Projekt</span>
    </div>
    <div class="filter-row" id="typeFilters" data-filter="type">
      <span class="fl-label">Typ</span>
    </div>
    <div class="filter-tools">
      <input type="text" class="search-input" id="searchInput" placeholder="Hledat v popisu…">
      <label class="toggle-unlogged">
        <input type="checkbox" id="onlyUnlogged"> jen nevykázané
      </label>
      <button class="reset-btn" id="resetBtn">reset filtrů</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-check"></th>
          <th>Projekt</th>
          <th>Typ</th>
          <th>Co</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="no-results" id="noResults" style="display:none;">Žádná položka neodpovídá filtru.</div>
  </div>

  <div class="tasks" id="tasksSection" style="display:none;">
    <h2>Otevřené úkoly</h2>
    <ul id="tasksList"></ul>
  </div>

  <p class="source-note" id="sourceNote"></p>

</div>

<script>
(function () {
  // ======================================================================
  // DATA — filled in per run. See SKILL.md for the shape of each object.
  // DAYS: ordered list of {key, label, date} shown left-to-right as headers.
  // CATS: map catSlot ("catA".."catF") -> display label for the legend/filter.
  // TYPES: map type key -> display label for the filter/pill.
  // ENTRIES: one row per unit of work.
  // ======================================================================

  var DAYS = __DAYS__;
  /* example:
  var DAYS = [
    { key: "2026-08-03", label: "Po", date: "3. 8." },
    { key: "2026-08-04", label: "Út", date: "4. 8." }
  ];
  */

  var CATS = __CATS__;
  /* example: { catA: "ČEPS-SOS", catB: "Bouračka FE", catD: "Nástroje" } */

  var TYPES = __TYPES__;
  /* example: { schuzka: "schůzka", review: "review", vyvoj: "vývoj", analyza: "analýza", dokumentace: "dokumentace" } */

  var ENTRIES = __ENTRIES__;
  /* example element:
  {
    id: "po1", day: "2026-08-03", cat: "catA", project: "ČEPS-SOS", type: "schuzka",
    title: "Status check",
    body: "Popis, HTML dovoleno: <code>foo.ts</code>, <span class='file'>bar.tsx</span>."
  }
  */

  var TASKS = __TASKS__; // array of strings, or [] to hide the section
  var STORAGE_KEY = __STORAGE_KEY__; // string, unique per report range e.g. "vykazovani-2026-08-03..2026-08-07"
  var SOURCE_NOTE = __SOURCE_NOTE__; // string

  // ======================================================================

  var checked = {};
  try { checked = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { checked = {}; }

  var state = {
    days: new Set(DAYS.map(function (d) { return d.key; })),
    cats: new Set(Object.keys(CATS)),
    types: new Set(Object.keys(TYPES)),
    search: "",
    onlyUnlogged: false
  };

  function saveChecked() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(checked)); } catch (e) {}
  }

  function buildChips(containerId, map, stateSet) {
    var container = document.getElementById(containerId);
    Object.keys(map).forEach(function (key) {
      var btn = document.createElement("button");
      btn.className = "chip active";
      btn.textContent = map[key];
      btn.dataset.key = key;
      btn.addEventListener("click", function () {
        if (stateSet.has(key)) { stateSet.delete(key); btn.classList.remove("active"); }
        else { stateSet.add(key); btn.classList.add("active"); }
        render();
      });
      container.appendChild(btn);
    });
  }

  buildChips("dayFilters", DAYS.reduce(function (acc, d) { acc[d.key] = d.label + " " + d.date; return acc; }, {}), state.days);
  buildChips("catFilters", CATS, state.cats);
  buildChips("typeFilters", TYPES, state.types);

  document.getElementById("searchInput").addEventListener("input", function (e) {
    state.search = e.target.value.trim().toLowerCase();
    render();
  });
  document.getElementById("onlyUnlogged").addEventListener("change", function (e) {
    state.onlyUnlogged = e.target.checked;
    render();
  });
  document.getElementById("resetBtn").addEventListener("click", function () {
    state.days = new Set(DAYS.map(function (d) { return d.key; }));
    state.cats = new Set(Object.keys(CATS));
    state.types = new Set(Object.keys(TYPES));
    state.search = "";
    state.onlyUnlogged = false;
    document.getElementById("searchInput").value = "";
    document.getElementById("onlyUnlogged").checked = false;
    document.querySelectorAll(".chip").forEach(function (c) { c.classList.add("active"); });
    render();
  });

  var tbody = document.getElementById("tableBody");

  DAYS.forEach(function (day) {
    var dayEntries = ENTRIES.filter(function (e) { return e.day === day.key; });
    if (!dayEntries.length) return;

    var headerTr = document.createElement("tr");
    headerTr.className = "day-header";
    headerTr.dataset.day = day.key;
    var th = document.createElement("th");
    th.colSpan = 4;
    th.innerHTML = '<div class="day-header-inner"><span class="dow">' + day.label + '</span>' +
      '<span class="date">' + day.date + '</span>' +
      '<span class="count" data-role="day-count"></span></div>';
    headerTr.appendChild(th);
    tbody.appendChild(headerTr);

    dayEntries.forEach(function (e) {
      var tr = document.createElement("tr");
      tr.className = "entry-row";
      tr.dataset.id = e.id;
      tr.dataset.day = e.day;
      tr.dataset.cat = e.cat;
      tr.dataset.type = e.type;
      tr.dataset.text = (e.title + " " + e.body + " " + e.project).toLowerCase();

      var tdCheck = document.createElement("td");
      tdCheck.className = "col-check";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.className = "checkbox";
      cb.checked = !!checked[e.id];
      cb.setAttribute("aria-label", "Vykázáno: " + e.title);
      cb.addEventListener("change", function () {
        checked[e.id] = cb.checked;
        tr.classList.toggle("checked", cb.checked);
        saveChecked();
        updateProgress();
        render();
      });
      tdCheck.appendChild(cb);

      var tdProj = document.createElement("td");
      tdProj.innerHTML = '<span class="tag ' + e.cat + '">' + e.project + '</span>';

      var tdType = document.createElement("td");
      tdType.innerHTML = '<span class="type-pill">' + TYPES[e.type] + '</span>';

      var tdDesc = document.createElement("td");
      tdDesc.className = "desc-cell";
      tdDesc.innerHTML = '<div class="title">' + e.title + '</div><div class="body">' + e.body + '</div>';

      tr.appendChild(tdCheck);
      tr.appendChild(tdProj);
      tr.appendChild(tdType);
      tr.appendChild(tdDesc);
      if (checked[e.id]) tr.classList.add("checked");
      tbody.appendChild(tr);
    });
  });

  document.getElementById("totalCount").textContent = " / " + ENTRIES.length;

  if (TASKS.length) {
    document.getElementById("tasksSection").style.display = "";
    var list = document.getElementById("tasksList");
    TASKS.forEach(function (t) {
      var li = document.createElement("li");
      li.textContent = t;
      list.appendChild(li);
    });
  }

  document.getElementById("sourceNote").textContent = SOURCE_NOTE;

  function updateProgress() {
    var done = ENTRIES.filter(function (e) { return checked[e.id]; }).length;
    document.getElementById("doneCount").textContent = done;
    document.getElementById("barFill").style.width = (ENTRIES.length ? (done / ENTRIES.length * 100) : 0) + "%";
  }

  function render() {
    var visible = 0;
    var perDay = {};

    document.querySelectorAll("tr.entry-row").forEach(function (tr) {
      var id = tr.dataset.id;
      var show = state.days.has(tr.dataset.day)
        && state.cats.has(tr.dataset.cat)
        && state.types.has(tr.dataset.type)
        && (!state.search || tr.dataset.text.indexOf(state.search) !== -1)
        && (!state.onlyUnlogged || !checked[id]);
      tr.classList.toggle("hidden-row", !show);
      if (show) {
        visible++;
        perDay[tr.dataset.day] = (perDay[tr.dataset.day] || 0) + 1;
      }
    });

    document.querySelectorAll("tr.day-header").forEach(function (tr) {
      var day = tr.dataset.day;
      var n = perDay[day] || 0;
      tr.classList.toggle("hidden-row", n === 0);
      var countEl = tr.querySelector('[data-role="day-count"]');
      if (countEl) countEl.textContent = n + (n === 1 ? " položka" : n < 5 ? " položky" : " položek");
    });

    document.getElementById("noResults").style.display = visible === 0 ? "block" : "none";
  }

  updateProgress();
  render();
})();
</script>
