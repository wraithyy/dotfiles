gui:
  theme:
    lightTheme: false
    activeBorderColor:
      - "#89b4fa" # blue
      - bold
    inactiveBorderColor:
      - "#6c7086" # surface0
    selectedLineBgColor:
      - "#313244" # surface1
    selectedRangeBgColor:
      - "#45475a" # surface2
    cherryPickedCommitBgColor:
      - "#94e2d5"
    cherryPickedCommitFgColor:
      - "#1e1e2e"
    unstagedChangesColor:
      - "#f38ba8" # red
  nerdFontsVersion: "3"
  border: rounded

git:
  # 1Password signs commits + holds the SSH auth key, so every background
  # fetch pops a 1Password approval dialog. Disable the 60s auto-fetch; fetch
  # manually with `f`. autoRefresh stays on (local-only, no SSH, no prompt).
  autoFetch: false
  paging:
    colorArg: always
    pager: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
customCommands:
  - key: "C"
    context: "files"
    description: "AI commit message (caveman)"
    command: |
      msg=$(git diff --cached | claude -p --model haiku 'Write commit message, Conventional Commits format. Subject: <=50 chars hard limit, imperative, type from feat/fix/refactor/docs/test/chore/perf/ci; covers dominant concern. Body: bullet list, one "- " line per distinct change, telegraphic style, no articles, no filler, <=60 chars per line. Single trivial change = subject only, no body. Output only the message, no quotes, no markdown.')
      git commit -e -m "$msg"
    output: terminal

keybinding:
 universal:
    quit: "q"
    return: "<esc>"
    nextTab: "ú"
    prevTab: ")"

