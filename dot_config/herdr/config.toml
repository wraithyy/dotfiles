key = "prefix+ě"
type = "shell"
command = "herdr tab focus $(herdr tab list | jq -r 'first(.result.tabs[] | select(.focused).workspace_id) as $w | [.result.tabs[] | select(.workspace_id==$w)][1].tab_id')"

