# ferry: popup to move panes/tabs between workspaces
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "shadowfax.ferry.open"

# termscope: pick a file/link visible on screen, open in split
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "termscope.picker"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "termscope.link-picker"

# lazygit popup — replaces tmux-lazygit-popup
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+left"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+down"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+up"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
