# resurrect: manual snapshot save / opt-in restore (autoRestore is off in
# plugin settings.json; autosave still runs on lifecycle events)
[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "save session snapshot"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "restore session snapshot"

# openr: fuzzy-open recent file paths / URLs from the current pane
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "openr.pick"
description = "open file/URL from pane"

# hintr: whichkey-style keybinding cheatsheet overlay
[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "hintr.show"
description = "keybinding cheatsheet"

# ferry: popup to move panes/tabs between workspaces
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "shadowfax.ferry.open"
description = "move panes/tabs between workspaces"

# lazygit popup — replaces tmux-lazygit-popup
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit popup"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "focus pane left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "focus pane down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "focus pane up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "focus pane right"

[[keys.command]]
key = "alt+left"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize pane left"

[[keys.command]]
key = "alt+down"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize pane down"

[[keys.command]]
key = "alt+up"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize pane up"

[[keys.command]]
key = "alt+right"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize pane right"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "waypoint.pick"
description = "new workspace from waypoint"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "waypoint.add"
description = "save folder as waypoint"
