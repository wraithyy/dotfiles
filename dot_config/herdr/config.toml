# herdr config — theme matches nvim/lazygit (catppuccin mocha); keybinds
# mirror the tmux-era smart-splits setup: alt+hjkl navigate, alt+arrows
# resize (herdr-splits.nvim handles the nvim side)

[theme]
name = "catppuccin"

# Palette mirrors nvim catppuccin color_overrides (plugins/ui.lua):
# teal accent (= nvim WinSeparator/FloatBorder), brighter overlays so
# sidebar/pane borders stand out against mocha surfaces.
[theme.custom]
accent = "#00e8c6"
teal = "#00e8c6"
green = "#96E072"
yellow = "#FFE66D"
peach = "#ee5d43"
mauve = "#c74ded"
overlay0 = "#808085"
overlay1 = "#9a9aa0"
# surface_dim draws pane/sidebar borders AND the selected-workspace highlight,
# so it's a muted teal: borders visible, selection background not neon
surface_dim = "#0b4a41"

[ui]
pane_borders = true
pane_gaps = true
accent = "#00e8c6"
show_agent_labels_on_pane_borders = true
# new tabs instantly, smart-rename names them anyway
prompt_new_tab_name = false

# in-app toasts ON (agent state, plugins); cache-ttl expiry warnings are
# muted via a local patch in its config.sh (WARN_THRESHOLDS=()) — re-apply
# after a cache-ttl plugin update
[ui.toast]
delivery = "herdr"

# claude agents: second row shows the live terminal title (what it's doing),
# brightened — default rendering is too dim to read
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], [{ token = "terminal_title_stripped", fg = "#bac2de", dim = false }], ["agent", { token = "$cache_ok", fg = "#96E072" }, { token = "$cache_warn", fg = "#FFE66D" }, { token = "$cache_crit", fg = "#ee5d43" }]]

[keys]
# splits: v = vertical (herdr default, Czech Mac has no easy pipe),
# prefix+minus = horizontal (default; Czech Mac minus = physical slash key).
# focus_pane_* h/j/k/l match tmux defaults.
split_vertical = "prefix+v"
# native herdr worktrees disabled — we use the /worktree Claude command
# (task/<name> branches in ../<repo>.worktrees/) instead
new_worktree = ""

# navigate mode, lazygit-style: j/k walk the sidebar workspace list
# (default had arrows for workspaces, j/k for panes — swapped)
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "down"
navigate_pane_up = "up"

# last workspace toggle (tmux C-\ analog) — § = top-left key on Czech Mac,
# same physical position as backtick on US layout
[[keys.command]]
key = "prefix+§"
type = "plugin_action"
command = "third774.last-workspace.toggle"

# fzf palette over all plugin actions
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "jt.command-palette.open"

# Czech keyboard tab jumps: unshifted digit row is +ěščřžýáí, so mirror the
# built-in switch_tab = prefix+1..9 for those keys (shell type = runs detached)
[[keys.command]]
key = "prefix+plus"
type = "shell"
command = "herdr tab focus $(herdr tab list | jq -r 'first(.result.tabs[] | select(.focused).workspace_id) as $w | [.result.tabs[] | select(.workspace_id==$w)][0].tab_id')"

