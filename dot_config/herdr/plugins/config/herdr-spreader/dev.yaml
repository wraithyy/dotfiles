# herdr-spreader port of tmuxp dev.yaml
#
#  [nvim+claude]          [term]      [git]
#  +-------------+------+ +---------+ +---------+
#  |    nvim     |claude| |   zsh   | | lazygit |
#  +-------------+------+ +---------+ +---------+
name: dev
tabs:
  - label: nvim+claude
    panes:
      - command: nvim
        focus: true
      - command: claude
        split: right
        ratio: 0.35
  - label: term
    panes:
      - {}
  - label: git
    panes:
      - command: lazygit
focus: true
