# Oh My Zsh bez složky `custom`, aby se nepřekrýval s pluginy a theme
[".oh-my-zsh"]
type = "git-repo"
url = "https://github.com/ohmyzsh/ohmyzsh"
refreshPeriod = "168h"
exclude = ["custom/**"]

# Pluginy
[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-syntax-highlighting"
refreshPeriod = "168h"
exact = true
clone.args = ["--quiet"]

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-autosuggestions"
refreshPeriod = "168h"
exact = true
clone.args = ["--quiet"]

[".oh-my-zsh/custom/plugins/fzf-tab"]
type = "git-repo"
url = "https://github.com/Aloxaf/fzf-tab"
refreshPeriod = "168h"
exact = true
clone.args = ["--quiet"]

[".oh-my-zsh/custom/plugins/you-should-use"]
type = "git-repo"
url = "https://github.com/MichaelAquilina/zsh-you-should-use"
refreshPeriod = "168h"
exact = true
clone.args = ["--quiet"]

# Téma
[".oh-my-zsh/custom/themes/powerlevel10k"]
type = "git-repo"
url = "https://github.com/romkatv/powerlevel10k"
refreshPeriod = "168h"
exact = true
clone.args = ["--quiet"]

# Tmux TPM plugin
[".tmux/plugins/tpm"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tpm"
refreshPeriod = "1h"

# pi: browser automation over CDP (replaces playwright/chrome-devtools MCP)
[".pi/agent/skills/browser-tools"]
type = "archive"
url = "https://github.com/badlogic/pi-skills/archive/90bb51cae36515a648515b633a81c0c6efc8c74d.tar.gz"
stripComponents = 2
include = ["*/browser-tools/**"]

# pi: selected mattpocock skills (grill-me, grilling, architecture/design)
[".pi/agent/skills/mattpocock"]
type = "archive"
url = "https://github.com/mattpocock/skills/archive/c55ee46073ed923f86ce59a5eb3b6d895095d1b7.tar.gz"
stripComponents = 1
include = ["*/skills", "*/skills/productivity", "*/skills/engineering", "*/skills/productivity/grill-me", "*/skills/engineering/grill-with-docs", "*/skills/engineering/improve-codebase-architecture", "*/skills/engineering/codebase-design", "*/skills/engineering/domain-modeling", "*/skills/productivity/grill-me/**", "*/skills/engineering/grill-with-docs/**", "*/skills/engineering/improve-codebase-architecture/**", "*/skills/engineering/codebase-design/**", "*/skills/engineering/domain-modeling/**"]

# cc-guard git hooks (gitleaks pre-commit, commit-msg format); core.hooksPath in .gitconfig
[".config/git/hooks/pre-commit"]
type = "file"
url = "https://raw.githubusercontent.com/wraithyy/cc-guard/bfc285ad6f348fbd858bed49101174c58ecd9ed8/plugins/cc-guard/git-hooks/pre-commit"
executable = true
refreshPeriod = "168h"

[".config/git/hooks/commit-msg"]
type = "file"
url = "https://raw.githubusercontent.com/wraithyy/cc-guard/bfc285ad6f348fbd858bed49101174c58ecd9ed8/plugins/cc-guard/git-hooks/commit-msg"
executable = true
refreshPeriod = "168h"
